name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # JOB 1: Test & Check Frontend (Next.js)
  # ==========================================
  frontend-check:
    name: Check Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Install pnpm FIRST so setup-node can find it
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # 2. Setup Node 22 (clears deprecation warnings) with pnpm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './frontend/pnpm-lock.yaml'

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm run lint

      - name: Type Check TypeScript
        run: pnpm exec tsc --noEmit

      - name: Build Frontend
        run: pnpm run build

  # ==========================================
  # JOB 2: Test & Check Backend (Express)
  # ==========================================
  backend-check:
    name: Check Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Install pnpm FIRST
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # 2. Setup Node 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './backend/pnpm-lock.yaml'

      - name: Install Backend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check TypeScript
        run: pnpm exec tsc --noEmit

      - name: Build Backend
        run: pnpm run build